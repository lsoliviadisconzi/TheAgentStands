<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Agent Stands | Tech Noir Reels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow+Condensed:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #0f1416;
  --fg: #e8efee;
  --mute: #93a5a8;
  --room: #1c2629;
  --paper: #ece7d8;
  --tag: #f2c230;
  --term: #9bd6a8;
  --line: #2a3739;
  --font-head: "Barlow Condensed", system-ui, sans-serif;
  --font-type: "Special Elite", Georgia, serif;
  --font-code: ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-head);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Header & Nav */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 16px 36px;
  border-bottom: 1px solid var(--line);
  background: rgba(15, 20, 22, 0.92);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo span {
  background: var(--tag);
  color: var(--room);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 15px;
  transform: rotate(-3deg);
}
.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.lang-select {
  background: var(--room);
  color: var(--fg);
  border: 1px solid var(--line);
  padding: 7px 12px;
  border-radius: 6px;
  font-family: var(--font-head);
  font-size: 16px;
  cursor: pointer;
  outline: none;
}
.lang-select:focus { border-color: var(--tag); }

/* Hero */
.hero {
  position: relative;
  padding: 64px 20px 44px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.lamp {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 620px;
  height: 360px;
  background: radial-gradient(ellipse at 50% 0, rgba(255, 244, 200, 0.14), rgba(255, 244, 200, 0) 70%);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
  pointer-events: none;
}
.hero-svg {
  width: 96px;
  margin-bottom: 16px;
  z-index: 1;
}
.hero-svg .head { fill: var(--room); stroke: var(--paper); stroke-width: 3; }
.hero-svg .eye { fill: var(--paper); }
.hero-svg .mouth { fill: none; stroke: var(--paper); stroke-width: 3; stroke-linecap: round; }
.hero-svg .badge { fill: var(--room); font-weight: bold; font-family: var(--font-head); }
.hero h1 {
  font-size: clamp(36px, 6vw, 60px);
  line-height: 1.05;
  margin-bottom: 12px;
  z-index: 1;
}
.hero p {
  font-family: var(--font-type);
  color: var(--mute);
  font-size: clamp(15px, 1.8vw, 18px);
  max-width: 640px;
  margin-bottom: 24px;
  z-index: 1;
}
.theme-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  z-index: 1;
  max-width: 900px;
}
.theme-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--room);
  color: var(--fg);
  text-decoration: none;
  font-size: 15px;
  letter-spacing: 0.03em;
  transition: border-color 0.2s, transform 0.2s;
}
.theme-pill:hover {
  border-color: var(--pill-tag, var(--tag));
  transform: translateY(-1px);
}
.theme-pill .dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--pill-tag, var(--tag));
}
.theme-pill small {
  color: var(--mute);
  font-size: 13px;
}

/* Main / Theme Sections */
main {
  flex: 1;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 40px 28px 64px;
  display: flex;
  flex-direction: column;
  gap: 48px;
}
.theme-section {
  border: 1px solid color-mix(in srgb, var(--t-tag, var(--tag)) 28%, var(--line));
  background: color-mix(in srgb, var(--t-room, var(--room)) 45%, var(--bg));
  border-radius: 16px;
  padding: 28px;
}
.theme-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid color-mix(in srgb, var(--t-tag, var(--tag)) 22%, var(--line));
}
.theme-kicker {
  display: inline-block;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--t-tag, var(--tag));
  margin-bottom: 4px;
}
.theme-head h2 {
  font-size: clamp(28px, 4vw, 38px);
  color: var(--t-paper, var(--paper));
  line-height: 1.05;
}
.theme-sub {
  font-family: var(--font-type);
  color: var(--t-dim, var(--mute));
  font-size: 15px;
  margin-top: 6px;
  max-width: 680px;
}
.theme-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.meta-chip {
  font-size: 13px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.28);
  border: 1px solid color-mix(in srgb, var(--t-tag, var(--tag)) 30%, transparent);
  color: var(--t-paper, var(--paper));
}
.swatch {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.swatch i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
}

/* Cards */
.episodes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 22px;
}
.card {
  background: var(--t-room, var(--room));
  border: 1px solid color-mix(in srgb, var(--t-tag, var(--tag)) 22%, var(--line));
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--t-tag, var(--tag));
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.card-tag {
  font-size: 13px;
  color: var(--t-tag, var(--tag));
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.card-badges {
  display: flex;
  gap: 6px;
  font-size: 12px;
  color: var(--t-dim, var(--mute));
}
.card-badges span {
  background: rgba(0,0,0,0.3);
  padding: 2px 7px;
  border-radius: 4px;
}
.card-cover {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 8px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.06);
}
.card h3 {
  font-size: 25px;
  color: var(--t-paper, var(--paper));
  line-height: 1.1;
}
.card p {
  font-family: var(--font-type);
  color: var(--t-dim, var(--mute));
  font-size: 14.5px;
  line-height: 1.45;
}
.card-log {
  margin-top: auto;
  font-family: var(--font-code);
  color: var(--term);
  font-size: 12.5px;
  background: rgba(0, 0, 0, 0.35);
  padding: 9px 10px;
  border-radius: 6px;
  line-height: 1.45;
}
.card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 6px;
  font-size: 14px;
  color: var(--t-tag, var(--tag));
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.empty-state {
  text-align: center;
  padding: 64px 20px;
  border: 1px dashed var(--line);
  border-radius: 16px;
  color: var(--mute);
}
.empty-state h2 { color: var(--fg); margin-bottom: 8px; font-size: 28px; }
.empty-state p { font-family: var(--font-type); font-size: 15px; }

/* Modal Player */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 12, 0.86);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}
.modal.open { display: flex; }
.modal-box {
  background: var(--room);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: min(520px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-size: 22px; }
.modal-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  background: rgba(255,255,255,0.06);
  color: var(--fg);
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 6px;
  font-family: var(--font-head);
  font-size: 15px;
  cursor: pointer;
}
.btn:hover { border-color: var(--tag); }
.modal-body {
  padding: 14px;
  display: flex;
  justify-content: center;
  background: #000;
}
.modal-body video,
.modal-body iframe {
  width: 100%;
  height: min(74vh, 640px);
  border: none;
  border-radius: 8px;
  background: #000;
}

/* Footer */
footer {
  margin-top: auto;
  padding: 32px 20px;
  text-align: center;
  border-top: 1px solid var(--line);
  color: var(--mute);
  font-family: var(--font-type);
  font-size: 14px;
}

@media (max-width: 640px) {
  header { padding: 14px 18px; }
  main { padding: 24px 14px 48px; }
  .theme-section { padding: 18px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Terminal Justice <span>Reels</span></div>
  <div class="header-controls">
    <select class="lang-select" id="langSwitcher" aria-label="Filter by language">
      <option value="all">All languages</option>
    </select>
  </div>
</header>

<section class="hero">
  <div class="lamp"></div>
  <svg class="hero-svg" viewBox="0 0 120 100" aria-hidden="true">
    <rect class="head" x="12" y="14" width="96" height="76" rx="18"/>
    <rect class="eye" x="34" y="42" width="12" height="12" rx="3"/>
    <rect class="eye" x="74" y="42" width="12" height="12" rx="3"/>
    <path class="mouth" d="M46 72 L74 72"/>
    <rect x="38" y="-2" width="44" height="16" rx="3" fill="#f2c230"/>
    <text class="badge" x="60" y="10" text-anchor="middle" font-size="12">AGENT</text>
  </svg>
  <h1>The Agent Takes the Stand</h1>
  <p>Reels published from the Studio, organized by theme, visual palette, and language.</p>
  <nav class="theme-pills" id="themePills" aria-label="Themes"></nav>
</section>

<main id="content">
  <div class="empty-state">
    <h2>Loading reels…</h2>
    <p>Fetching published reels from the Studio.</p>
  </div>
</main>

<div class="modal" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Reel</h3>
      <div class="modal-actions">
        <button class="btn" id="modeToggle" style="display:none">Live player</button>
        <button class="btn" id="modalClose">Close ×</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>
  <p>© 2026 Terminal Justice. Real autonomy isn't a punchline. It's an architecture.</p>
</footer>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const slug = (s) => String(s || 'custom').toLowerCase().replace(/[^a-z0-9]+/g, '-');

let allReels = [];
let themeMap = new Map();
let activeLang = 'all';

const langSwitcher = document.getElementById('langSwitcher');
const themePills = document.getElementById('themePills');
const content = document.getElementById('content');
const modal = document.getElementById('playerModal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modeToggle = document.getElementById('modeToggle');

function closeModal() {
  modal.classList.remove('open');
  modalBody.innerHTML = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function openReel(reel) {
  modalTitle.textContent = reel.title || 'Reel';
  let useVideo = !!reel.videoUrl;
  const renderMedia = () => {
    if (useVideo && reel.videoUrl) {
      modalBody.innerHTML = `<video src="${esc(reel.videoUrl)}" controls autoplay playsinline></video>`;
      modeToggle.textContent = 'Live player';
    } else {
      modalBody.innerHTML = `<iframe src="${esc(reel.playerUrl)}" allow="autoplay" title="${esc(reel.title)}"></iframe>`;
      modeToggle.textContent = 'Exported MP4';
    }
  };
  if (reel.videoUrl && reel.playerUrl) {
    modeToggle.style.display = '';
    modeToggle.onclick = () => { useVideo = !useVideo; renderMedia(); };
  } else {
    modeToggle.style.display = 'none';
  }
  renderMedia();
  modal.classList.add('open');
}

function render() {
  const filtered = activeLang === 'all' ? allReels : allReels.filter((r) => (r.lang || 'en') === activeLang);

  if (!filtered.length) {
    themePills.innerHTML = '';
    content.innerHTML = `
      <div class="empty-state">
        <h2>No reels on Landing yet</h2>
        <p>Open Reel Manager and check <b>Landing</b> on any reel to feature it here.</p>
      </div>`;
    return;
  }

  // Group by theme
  const groups = new Map();
  for (const r of filtered) {
    const key = r.theme || 'Custom';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }

  // Theme jump pills
  themePills.innerHTML = Array.from(groups.entries()).map(([themeName, list]) => {
    const t = themeMap.get(themeName);
    const tag = t?.tag || '#f2c230';
    return `<a class="theme-pill" href="#theme-${esc(slug(themeName))}" style="--pill-tag:${esc(tag)}">
      <i class="dot"></i>
      <span>${esc(themeName)}</span>
      <small>${list.length}</small>
    </a>`;
  }).join('');

  // Theme sections
  content.innerHTML = Array.from(groups.entries()).map(([themeName, list]) => {
    const t = themeMap.get(themeName) || {
      name: themeName,
      subtitle: 'Custom reels created in Studio.',
      room: '#1c2629',
      paper: '#ece7d8',
      tag: '#f2c230',
      dim: '#93a5a8',
      languages: Array.from(new Set(list.map((r) => r.lang || 'en'))),
    };
    const langsUsed = Array.from(new Set(list.map((r) => (r.lang || 'en').toUpperCase())));
    const cardsHtml = list.map((r, idx) => {
      const logs = (r.lines || []).flatMap((l) => l.log || []).slice(0, 2);
      const dur = ((r.plan?.totalMs || 0) / 1000).toFixed(1);
      return `
        <article class="card" data-reel-id="${esc(r.id)}">
          <div class="card-top">
            <span class="card-tag">Reel ${String(idx + 1).padStart(2, '0')}</span>
            <div class="card-badges">
              <span>${esc((r.lang || 'en').toUpperCase())}</span>
              <span>${esc(dur)}s</span>
              <span>${r.videoUrl ? 'MP4' : 'Live'}</span>
            </div>
          </div>
          ${r.coverUrl ? `<img class="card-cover" src="${esc(r.coverUrl)}" alt="">` : ''}
          <h3>${esc(r.title)}</h3>
          <p>${esc(r.hook || r.lines?.[0]?.s || '')}</p>
          ${logs.length ? `<div class="card-log">${logs.map((line) => `&gt; ${esc(line)}`).join('<br>')}</div>` : ''}
          <div class="card-foot">
            <span>${r.lines?.length || 0} lines</span>
            <span>Watch ▶</span>
          </div>
        </article>`;
    }).join('');

    return `
      <section class="theme-section" id="theme-${esc(slug(themeName))}"
        style="--t-room:${esc(t.room)};--t-paper:${esc(t.paper)};--t-tag:${esc(t.tag)};--t-dim:${esc(t.dim)}">
        <div class="theme-head">
          <div>
            <span class="theme-kicker">Theme · ${list.length} ${list.length === 1 ? 'reel' : 'reels'}</span>
            <h2>${esc(themeName)}</h2>
            ${t.subtitle ? `<p class="theme-sub">${esc(t.subtitle)}</p>` : ''}
          </div>
          <div class="theme-meta">
            <span class="meta-chip swatch" title="Theme palette">
              <i style="background:${esc(t.room)}"></i>
              <i style="background:${esc(t.tag)}"></i>
              <i style="background:${esc(t.paper)}"></i>
              Palette
            </span>
            <span class="meta-chip">${langsUsed.join(' · ')}</span>
          </div>
        </div>
        <div class="episodes">${cardsHtml}</div>
      </section>`;
  }).join('');

  content.querySelectorAll('.card[data-reel-id]').forEach((el) => {
    el.addEventListener('click', () => {
      const r = allReels.find((x) => x.id === el.getAttribute('data-reel-id'));
      if (r) openReel(r);
    });
  });
}

async function boot() {
  try {
    const [reelsRes, themesRes] = await Promise.all([
      fetch('/api/landing'),
      fetch('/api/landing/themes'),
    ]);
    allReels = reelsRes.ok ? await reelsRes.json() : [];
    const themes = themesRes.ok ? await themesRes.json() : [];
    themeMap = new Map(themes.map((t) => [t.name, t]));

    const langs = Array.from(new Set(allReels.map((r) => r.lang || 'en'))).sort();
    langSwitcher.innerHTML = `<option value="all">All languages (${allReels.length})</option>` +
      langs.map((l) => `<option value="${esc(l)}">${esc(l.toUpperCase())}</option>`).join('');
    render();
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><h2>Could not load reels</h2><p>Make sure the backend server is running.</p></div>`;
  }
}

langSwitcher.addEventListener('change', (e) => {
  activeLang = e.target.value;
  render();
});

boot();
</script>
</body>
</html>
